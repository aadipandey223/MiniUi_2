<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VaultBeam — Encrypted P2P File Transfer</title>
    <meta
      name="description"
      content="Direct, private peer-to-peer file sharing encrypted in your browser with optional private rooms, auto-expiry, and advanced transfer scheduling."
    />
    <meta property="og:title" content="VaultBeam — Encrypted P2P File Transfer" />
    <meta
      property="og:description"
      content="Direct, private peer-to-peer file sharing encrypted in your browser with optional private rooms, auto-expiry, and advanced transfer scheduling."
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('vaultbeam_mono_theme');
          var theme = saved === 'dark' || saved === 'cipher' ? saved : 'light';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          if (theme === 'light') {
            root.classList.remove('dark');
          } else {
            root.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
